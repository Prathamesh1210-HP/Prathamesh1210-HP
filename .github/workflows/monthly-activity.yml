name: Update Monthly GitHub Activity

on:
  workflow_dispatch:

  schedule:
    - cron: "15 0 1 * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update monthly activity graph
        env:
          USERNAME: Prathamesh1210-HP
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)

          START_DATE="${YEAR}-${MONTH}-01"
          NEXT_MONTH=$(date -d "${START_DATE} +1 month" +%Y-%m-01)
          END_DATE=$(date -d "${NEXT_MONTH} -1 day" +%Y-%m-%d)
          MONTH_NAME=$(date -d "${START_DATE}" +"%B %Y")

          GRAPH_URL="https://github-readme-activity-graph.vercel.app/graph?username=${USERNAME}&from=${START_DATE}&to=${END_DATE}&theme=tokyo-night&hide_border=true&area=true&radius=12&height=300&custom_title=Prathamesh%27s%20GitHub%20Activity"

          python -c "
          from pathlib import Path
          import os

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          start = '<!-- MONTHLY_ACTIVITY_START -->'
          end = '<!-- MONTHLY_ACTIVITY_END -->'

          month_name = os.environ.get('MONTH_NAME', '${MONTH_NAME}')
          graph_url = '${GRAPH_URL}'

          new_section = f'''<!-- MONTHLY_ACTIVITY_START -->
          ## 📈 GitHub Activity — ${MONTH_NAME}

          <p align=\"center\">
            <a href=\"https://github.com/Prathamesh1210-HP\">
              <img
                src=\"{graph_url}\"
                width=\"95%\"
              />
            </a>
          </p>

          <!-- MONTHLY_ACTIVITY_END -->'''

          if start not in text:
              raise SystemExit('ERROR: MONTHLY_ACTIVITY_START marker not found in README.md')

          if end not in text:
              raise SystemExit('ERROR: MONTHLY_ACTIVITY_END marker not found in README.md')

          before = text.split(start)[0]
          after = text.split(end, 1)[1]

          path.write_text(
              before + new_section + after,
              encoding='utf-8'
          )

          print(f'Updated graph for {month_name}')
          "

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📈 Update monthly GitHub activity"
            git push
          fi
